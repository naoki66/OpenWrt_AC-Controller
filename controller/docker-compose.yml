services:
  ac:
    build:
      # Build context is the repository root: the Dockerfile compiles the Go
      # module and only the controller binary ends up in the image.
      context: ..
      dockerfile: controller/Dockerfile
      args:
        VERSION: dev
        COMMIT: local
        DATE: "${BUILD_DATE:-unknown}"
    image: ac-controller:dev
    container_name: ac-controller
    restart: unless-stopped
    # AP discovery relies on receiving subnet broadcasts, which bridge
    # networking does not forward. Host networking is required.
    network_mode: host
    environment:
      # 定时重启/LED 的 HH:MM 按这个时区解释；不设时容器默认 UTC。
      TZ: ${TZ:-Asia/Shanghai}
      AC_DATA_DIR: /var/lib/ac
      AC_HTTP_ADDR: ":8090"
      AC_DISCOVER_ADDR: ":29820"
      AC_SHARED_SECRET: "${AC_SHARED_SECRET:-}"
      # 首次启动和迁移旧默认密码时需设置。
      AC_ADMIN_PASSWORD: "${AC_ADMIN_PASSWORD:-}"
      # 该令牌仅供自动化脚本以 Bearer 方式访问管理 REST。
      AC_ADMIN_TOKEN: "${AC_ADMIN_TOKEN:-}"
      # 下发给所有 AP 的站点 NTP 源；AP 本地持久化，AC 离线后继续生效。
      AC_NTP_SERVERS: "${AC_NTP_SERVERS:-}"
      # AC_ADVERTISE_IP: "192.168.1.10"
    volumes:
      - ./data:/var/lib/ac
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
