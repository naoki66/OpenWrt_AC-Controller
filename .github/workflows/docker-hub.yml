name: Docker Image (Docker Hub + GHCR)

# 仅手动触发，防止误推镜像。
# 用法：Actions → Docker Image (Docker Hub + GHCR) → Run workflow
#   publish = none：只构建验证（amd64），不登录、不推送
#   publish = push：构建 linux/amd64 + linux/arm64 并同时推送到 Docker Hub 与 GHCR
#
# 凭据：
#   Docker Hub：仓库 Settings → Secrets 配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
#   GHCR：自动使用 GITHUB_TOKEN（无需额外 Secret；本工作流已申请 packages: write 权限）

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '是否推送到镜像仓库（none = 仅构建验证）'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - push
      tag:
        description: '镜像标签（如 latest、v1.2.3）'
        required: true
        default: 'latest'
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: naoki66/openwrt_ac-controller
  GHCR_IMAGE: ghcr.io/naoki66/openwrt_ac-controller

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build metadata
        id: meta
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # 写入二进制的版本号：发布类标签（v1.2.3）直接用；
          # latest 等滚动标签没有版本含义，改用 日期-短sha，
          # 否则系统页会一直显示 "latest"，看不出实际是哪次构建。
          tag='${{ inputs.tag }}'
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: inputs.publish == 'push'
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: inputs.publish == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: inputs.publish == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only (dry run, amd64)
        if: inputs.publish != 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: controller/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.short }}
            DATE=${{ steps.meta.outputs.date }}

      - name: Build and push (amd64 + arm64)
        if: inputs.publish == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: controller/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.short }}
            ${{ env.GHCR_IMAGE }}:${{ inputs.tag }}
            ${{ env.GHCR_IMAGE }}:sha-${{ steps.meta.outputs.short }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.short }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
