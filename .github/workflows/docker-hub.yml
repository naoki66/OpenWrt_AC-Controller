name: Docker Image (Docker Hub + GHCR)

# 构建服务端镜像（AC 管理面）并按条件推送。仓库公开后 CI 接管了原先本地的
# 多架构构建，推到 main 即出镜像，不再依赖某台开发机在线。
#
# 触发：
#   push 到 main       -> 自动构建 linux/amd64 + linux/arm64 并推送
#                         GHCR（GITHUB_TOKEN 内置凭据，恒可用）与 Docker Hub
#                         （需仓库 Secrets 配置 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN，
#                         未配置时自动跳过 Docker Hub，只推 GHCR）
#   workflow_dispatch  -> 手动构建
#     publish = none：只构建验证（amd64），不登录、不推送
#     publish = push：按 tag 输入构建双架构并推送到 Docker Hub 与 GHCR
#
# 凭据：
#   Docker Hub：仓库 Settings → Secrets 配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
#   GHCR：自动使用 GITHUB_TOKEN（无需额外 Secret；本工作流已申请 packages: write 权限）

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'agent/openwrt/**'
  workflow_dispatch:
    inputs:
      publish:
        description: '是否推送到镜像仓库（none = 仅构建验证）'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - push
      tag:
        description: '镜像标签（如 latest、v1.2.3）'
        required: true
        default: 'latest'
        type: string

permissions:
  contents: read
  packages: write

# 同一分支的连续推送只保留最后一次构建，避免排队堆积。
concurrency:
  group: docker-hub-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: naoki66/openwrt_ac-controller
  GHCR_IMAGE: ghcr.io/naoki66/openwrt_ac-controller

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

          # 滚动标签：push 到 main 的自动构建，或手动输入留空/latest。
          # 发布类标签（v1.2.3）直接作为写入二进制的版本号；latest 等滚动
          # 标签没有版本含义，改用 日期-短sha，否则系统页会一直显示
          # "latest"，看不出实际是哪次构建。
          base="$INPUT_TAG"
          if [ -z "$base" ]; then
            base=latest
          fi
          if [[ "$base" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            version="$base"
          else
            version="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

          # 发布判定：push 到 main 自动发布；手动触发按 publish 输入。
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$INPUT_PUBLISH" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

          # GHCR 用内置 GITHUB_TOKEN 恒可用；Docker Hub 需要显式 Secret。
          # secrets 不能直接在 step 的 if 里判空，所以先落到 env 再判。
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "push_dockerhub=true" >> "$GITHUB_OUTPUT"
            {
              echo "docker_tags<<EOF"
              echo "${{ env.IMAGE }}:$base"
              echo "${{ env.IMAGE }}:sha-${GITHUB_SHA::7}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "push_dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "ghcr_tags<<EOF"
            echo "${{ env.GHCR_IMAGE }}:$base"
            echo "${{ env.GHCR_IMAGE }}:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.meta.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.meta.outputs.push_dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only (dry run, amd64)
        if: steps.meta.outputs.publish != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: controller/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.short }}
            DATE=${{ steps.meta.outputs.date }}

      - name: Build and push (amd64 + arm64)
        if: steps.meta.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: controller/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.ghcr_tags }}
            ${{ steps.meta.outputs.docker_tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.short }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
